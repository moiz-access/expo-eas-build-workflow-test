name: Publish to Preview

on:
  workflow_dispatch:

jobs:
  guard:
    name: Verify branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel run if not on uat branch
        if: github.ref != 'refs/heads/uat'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "❌ Publish workflow must be run on the uat branch"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
          # Give GitHub a moment to process the cancellation before this job exits
          sleep 30

  check-fingerprint:
    name: Check native fingerprint
    needs: guard
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.compare.outputs.needs-build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      # Install pnpm first before setting up Node.js
      # Version is read automatically from `packageManager` in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: pnpm

      # Install Expo and EAS
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compute the fingerprint of the current native code/config on this commit
      # Requires `runtimeVersion.policy: "fingerprint"` in app.json/app.config.*
      - name: Generate current fingerprint
        id: current
        run: |
          npx expo-updates fingerprint:generate --platform android > fingerprint.json
          HASH=$(jq -r '.hash' fingerprint.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "🔎 Current build fingerprint: $HASH"

      # Look up the most recent finished build on the preview profile and read the fingerprint that build was created with
      - name: Fetch latest preview build
        id: latest-build
        run: |
          eas build:list \
            --platform android \
            --profile preview \
            --status finished \
            --limit 1 \
            --non-interactive \
            --json > builds.json

          HASH=$(jq -r '.[0].fingerprintHash // empty' builds.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "🔎 Latest build fingerprint: $HASH"

      # Compare the two fingerprints
      - name: Compare fingerprints
        id: compare
        run: |
          if [ -z "${{ steps.latest-build.outputs.hash }}" ] || \
             [ "${{ steps.current.outputs.hash }}" != "${{ steps.latest-build.outputs.hash }}" ]; then
            echo "❎ Native fingerprint changed (or no prior build found) — running EAS Build"
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Native fingerprint unchanged — running EAS Update"
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: EAS build preview
    needs: check-fingerprint
    if: needs.check-fingerprint.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      # Install pnpm, tools and dependencies
      # Version is read automatically from `packageManager` in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run build
      - name: Run EAS build
        run: eas build --platform android --profile preview --non-interactive

  update:
    name: EAS update preview
    needs: check-fingerprint
    if: needs.check-fingerprint.outputs.needs-build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      # Install pnpm, tools and dependencies
      # Version is read automatically from `packageManager` in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run update
      - name: Run EAS update
        run: eas update --branch preview --non-interactive
