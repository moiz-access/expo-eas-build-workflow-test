name: EAS Build Preview

on:
  workflow_dispatch:

jobs:
  guard:
    name: Verify branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel run if not on uat branch
        if: github.ref != 'refs/heads/uat'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "❌ Build workflow must be run on the uat branch. Cancelling run."
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
          # Give GitHub a moment to process the cancellation before this job exits
          sleep 30

  build:
    name: EAS build preview
    needs: guard
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      # Install pnpm first before setting up Node.js
      # Version is read automatically from `packageManager` in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: pnpm

      # Install Expo and EAS
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run build
      - name: Run EAS build
        run: eas build --platform android --profile preview --non-interactive
